<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Jarvis</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; gap: 1.5rem; align-content: center;
      background: radial-gradient(120% 80% at 30% 20%, #16263d, #0f1b2d 60%);
      color: #ede7da; font: 400 1rem/1.5 "Figtree", system-ui, sans-serif;
    }
    .orb {
      width: 7rem; height: 7rem; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ffe2a6, #f0b44c 45%, #8a5a1c 100%);
      box-shadow: 0 0 4rem #f0b44c55; animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe { 50% { transform: scale(0.92); opacity: 0.75; } }
    p { margin: 0; color: #9fb8c8; text-align: center; max-width: 36rem; padding: 0 1.5rem; }
    .error .orb { animation: none; filter: grayscale(0.8); }
    .error p { color: #e07a6f; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <p id="status" role="status"></p>
  <script>
    // The backend is not running yet: the language of the system, as Jarvis' own default
    const texts = {
      it: {
        starting: 'Avvio di Jarvis…',
        firstDatabase: 'Prima configurazione del database (solo questa volta)…',
        cannotStart: 'Non riesco ad avviare Jarvis: {detail}',
        badAddress: 'Indirizzo del backend non valido: {detail}',
        exited: 'Jarvis si è chiuso all\'avvio ({detail}).\nDettagli in {log}',
        noAnswer: 'Jarvis non risponde. Riprova più tardi o controlla i log in ~/.jarvis/logs.',
      },
      en: {
        starting: 'Starting Jarvis…',
        firstDatabase: 'Setting up the database (only this once)…',
        cannotStart: 'I can\'t start Jarvis: {detail}',
        badAddress: 'The backend address is not valid: {detail}',
        exited: 'Jarvis closed while starting ({detail}).\nDetails in {log}',
        noAnswer: 'Jarvis does not answer. Try again later or check the logs in ~/.jarvis/logs.',
      },
    };
    const language = navigator.language.slice(0, 2).toLowerCase() === 'it' ? 'it' : 'en';
    document.documentElement.lang = language;
    const text = (key, params = {}) => (texts[language][key] ?? key)
      .replace(/\{(\w+)\}/g, (match, name) => params[name] ?? match);
    const status = document.getElementById('status');
    status.textContent = text('starting');
    // Called by the shell: progress of the start, or why it failed
    window.setStatus = (key) => { status.textContent = text(key); };
    window.showError = (key, params) => {
      document.body.classList.add('error');
      status.textContent = text(key, params);
    };
  </script>
</body>
</html>
