# Local services for development. Started automatically by `mvn spring-boot:run` (Spring Boot Docker Compose
# support); with `java -jar` run `docker compose up -d` first. The desktop app needs none of this: it ships its own
# PostgreSQL, and the local voice (whisper.cpp, Piper) is run by Jarvis itself.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
    ports:
      # 5433 to avoid clashing with other local Postgres instances; loopback only
      - "127.0.0.1:5433:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql

volumes:
  jarvis-pgdata:
